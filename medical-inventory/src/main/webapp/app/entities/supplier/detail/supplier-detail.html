<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (supplier(); as supplierRef) {
      <div>
        <h2 data-cy="supplierDetailsHeading"><span>Supplier</span></h2>

        <hr />

        <mi-alert-error />

        <mi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ supplierRef.id }}</span>
          </dd>
          <dt><span>Name</span></dt>
          <dd>
            <span>{{ supplierRef.name }}</span>
          </dd>
          <dt><span>Contact Name</span></dt>
          <dd>
            <span>{{ supplierRef.contactName }}</span>
          </dd>
          <dt><span>Email</span></dt>
          <dd>
            <span>{{ supplierRef.email }}</span>
          </dd>
          <dt><span>Phone</span></dt>
          <dd>
            <span>{{ supplierRef.phone }}</span>
          </dd>
          <dt><span>Active</span></dt>
          <dd>
            <span>{{ supplierRef.active }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/supplier', supplierRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>
