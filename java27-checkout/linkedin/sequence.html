<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<style>html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#f3efe6}svg{display:block;width:1080px;height:1350px}</style>
</head><body><svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <style>
    text { font-family: Inter, "Liberation Sans", sans-serif; fill: #1a1714; }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
    text.on-dark { fill: #f6f1e7; }
    text.hint { fill: #c8bfb0; }
    text.bad { fill: #c23b2e; }
    text.gold { fill: #a15c12; }
    text.dim { fill: #5e584e; }
  </style>
  <rect width="1080" height="1350" fill="#f3efe6"/>

  <text class="mono gold" x="56" y="64" font-size="16" letter-spacing="2.4">SEQUENCE  /  FRAUD DECLINES THE CARD</text>
  <text x="56" y="118" font-size="46" font-weight="650">The other calls do not keep running.</text>
  <text class="dim" x="56" y="156" font-size="20">Checkout opens one scope. The scope forks the calls and cancels the ones still in flight.</text>

  <!-- participant boxes -->
  <g font-size="18" font-weight="650">
    <g>
      <rect x="40" y="196" width="156" height="58" rx="14" fill="#1a1714"/>
      <text class="on-dark" x="118" y="222" text-anchor="middle">Checkout</text>
      <text class="mono hint" x="118" y="242" text-anchor="middle" font-size="12" font-weight="450">owner</text>
    </g>
    <g>
      <rect x="246" y="196" width="156" height="58" rx="14" fill="#1a1714"/>
      <text class="on-dark" x="324" y="222" text-anchor="middle">Scope</text>
      <text class="mono hint" x="324" y="242" text-anchor="middle" font-size="12" font-weight="450">800 ms</text>
    </g>
    <g>
      <rect x="452" y="196" width="156" height="58" rx="14" fill="#1a1714"/>
      <text class="on-dark" x="530" y="222" text-anchor="middle">Warehouse</text>
      <text class="mono hint" x="530" y="242" text-anchor="middle" font-size="12" font-weight="450">hold</text>
    </g>
    <g>
      <rect x="658" y="196" width="156" height="58" rx="14" fill="#1a1714"/>
      <text class="on-dark" x="736" y="222" text-anchor="middle">Pricing</text>
      <text class="mono hint" x="736" y="242" text-anchor="middle" font-size="12" font-weight="450">quote</text>
    </g>
    <g>
      <rect x="864" y="196" width="156" height="58" rx="14" fill="#1a1714"/>
      <text class="on-dark" x="942" y="222" text-anchor="middle">Fraud</text>
      <text class="mono hint" x="942" y="242" text-anchor="middle" font-size="12" font-weight="450">screen</text>
    </g>
  </g>

  <!-- lifelines -->
  <g stroke="#b7ad9e" stroke-width="2" stroke-dasharray="8 6">
    <line x1="118" y1="254" x2="118" y2="1128"/>
    <line x1="324" y1="254" x2="324" y2="1128"/>
    <line x1="530" y1="254" x2="530" y2="1128"/>
    <line x1="736" y1="254" x2="736" y2="1128"/>
    <line x1="942" y1="254" x2="942" y2="1128"/>
  </g>

  <!-- activations -->
  <rect x="522" y="430" width="16" height="500" rx="3" fill="#1d6b45" opacity="0.18"/>
  <rect x="728" y="520" width="16" height="410" rx="3" fill="#1d6b45" opacity="0.18"/>
  <rect x="934" y="610" width="16" height="150" rx="3" fill="#c23b2e" opacity="0.22"/>

  <defs>
    <marker id="ink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1a1714"/>
    </marker>
    <marker id="red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c23b2e"/>
    </marker>
  </defs>

  <!-- open -->
  <line x1="118" y1="310" x2="314" y2="310" stroke="#1a1714" stroke-width="2" marker-end="url(#ink)"/>
  <text class="mono" x="128" y="300" font-size="15">open(checkout-ord-42)</text>

  <!-- fork hold -->
  <line x1="118" y1="380" x2="314" y2="380" stroke="#1a1714" stroke-width="2" marker-end="url(#ink)"/>
  <text class="mono" x="128" y="370" font-size="15">fork hold(BOOK-1, 2)</text>

  <!-- hold -->
  <line x1="324" y1="450" x2="520" y2="450" stroke="#1a1714" stroke-width="2" marker-end="url(#ink)"/>
  <text class="mono" x="336" y="440" font-size="15">hold()</text>

  <!-- fork quote -->
  <line x1="118" y1="510" x2="314" y2="510" stroke="#1a1714" stroke-width="2" marker-end="url(#ink)"/>
  <text class="mono" x="128" y="500" font-size="15">fork quote(IE)</text>

  <!-- quote -->
  <line x1="324" y1="560" x2="726" y2="560" stroke="#1a1714" stroke-width="2" marker-end="url(#ink)"/>
  <rect x="332" y="524" width="78" height="22" rx="4" fill="#f3efe6"/>
  <text class="mono" x="340" y="540" font-size="15">quote()</text>

  <!-- fork screen -->
  <line x1="118" y1="630" x2="314" y2="630" stroke="#1a1714" stroke-width="2" marker-end="url(#ink)"/>
  <text class="mono" x="128" y="620" font-size="15">fork screen(tok_visa)</text>

  <!-- screen -->
  <line x1="324" y1="690" x2="932" y2="690" stroke="#1a1714" stroke-width="2" marker-end="url(#ink)"/>
  <rect x="752" y="654" width="92" height="22" rx="4" fill="#f3efe6"/>
  <text class="mono" x="760" y="670" font-size="15">screen()</text>

  <!-- declined return -->
  <line x1="942" y1="790" x2="334" y2="790" stroke="#c23b2e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#red)"/>
  <rect x="392" y="752" width="230" height="22" rx="4" fill="#f3efe6"/>
  <text class="mono bad" x="400" y="768" font-size="15">FraudDeclinedException</text>

  <!-- cancels -->
  <line x1="324" y1="870" x2="520" y2="870" stroke="#c23b2e" stroke-width="2.5" marker-end="url(#red)"/>
  <text class="mono bad" x="348" y="860" font-size="15">cancel hold()</text>

  <line x1="324" y1="950" x2="726" y2="950" stroke="#c23b2e" stroke-width="2.5" marker-end="url(#red)"/>
  <text class="mono bad" x="340" y="940" font-size="15">cancel quote()</text>

  <!-- join failure -->
  <line x1="324" y1="1040" x2="128" y2="1040" stroke="#c23b2e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#red)"/>
  <text class="mono bad" x="136" y="1028" font-size="15">ExecutionException</text>

  <rect x="56" y="1160" width="968" height="130" rx="16" fill="#fffdf8" stroke="#d9d1c3"/>
  <text class="mono gold" x="80" y="1198" font-size="13" letter-spacing="1.4">AFTER THE SCOPE CLOSES</text>
  <text x="80" y="1232" font-size="20">Checkout unwraps the cause and throws FraudDeclinedException.</text>
  <text class="dim" x="80" y="1262" font-size="20">join() never builds a quote. If all three had succeeded, it would return</text>
  <text class="dim" x="80" y="1292" font-size="20">and those results would become one CheckoutQuote.</text>
</svg>
</body></html>
